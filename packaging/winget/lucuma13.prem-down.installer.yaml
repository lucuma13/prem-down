---
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
# Template: the version, tag, SHA256 and product-code placeholders below are
# filled in by the publish-windows-installer job in publish.yml from the MSI it
# just built. PackageVersion is the bare number; InstallerUrl uses the git tag -
# the release is addressed by tag, the package by version.
PackageIdentifier: lucuma13.prem-down
PackageVersion: "__VERSION__"
InstallerType: wix
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
Commands:
  - prem-down
FileExtensions:
  - prproj
  - prodset
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/lucuma13/prem-down/releases/download/__TAG__/prem-down_installer_windows.msi
    InstallerSha256: __SHA256__
    ProductCode: "__PRODUCT_CODE__"
ManifestType: installer
ManifestVersion: 1.6.0
